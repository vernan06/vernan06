<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Neural architecture signal propagation</title>
  <desc id="description">A five-layer neural network diagram with signals moving from input through three hidden layers to output.</desc>
  <style>
    .signal {
      stroke-dasharray: 5 420;
      animation: transmit 10s linear infinite;
    }
    .delay-1 { --offset: 0s; }
    .delay-2 { --offset: 0.14s; }
    .delay-3 { --offset: 0.28s; }
    .delay-4 { --offset: 0.42s; }
    .stage-1 .signal { animation-delay: var(--offset, 0s); }
    .stage-2 .signal { animation-delay: calc(1.7s + var(--offset, 0s)); }
    .stage-3 .signal { animation-delay: calc(3.4s + var(--offset, 0s)); }
    .stage-4 .signal { animation-delay: calc(5.1s + var(--offset, 0s)); }
    .input-nodes .node-ring { animation-delay: 0.2s; }
    .layer-1 .node-ring { animation-delay: 1.3s; }
    .layer-2 .node-ring { animation-delay: 3s; }
    .layer-3 .node-ring { animation-delay: 4.7s; }
    .output-nodes .node-ring { animation-delay: 6.4s; }
    .node-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: neuron-state 10s ease-out infinite;
    }
    @keyframes transmit {
      0%, 1% { stroke-dashoffset: 0; opacity: 0; }
      2% { opacity: 0.9; }
      14% { stroke-dashoffset: -420; opacity: 0.72; }
      17%, 100% { stroke-dashoffset: -420; opacity: 0; }
    }
    @keyframes neuron-state {
      0%, 4% { opacity: 0.28; transform: scale(1); }
      8% { opacity: 0.95; transform: scale(1.55); }
      15% { opacity: 0.34; transform: scale(1); }
      100% { opacity: 0.28; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal, .node-ring { animation: none !important; }
      .signal { stroke-dasharray: 5 420; stroke-dashoffset: 0; opacity: 0.16; }
      .node-ring { opacity: 0.34; transform: none; }
    }
  </style>
