<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="60 142 1010 206" role="img" aria-labelledby="title description">
  <title id="title">Terminal view of a neural architecture</title>
  <desc id="description">A five-layer neural network rendered as a monospace terminal diagram. Signals travel from input through three hidden layers to output.</desc>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .wire { fill: none; stroke: #7c8687; stroke-width: 1.25; stroke-dasharray: 5 4; opacity: 0.48; }
    .signal {
      fill: none;
      stroke: #738b73;
      stroke-width: 2;
      stroke-dasharray: 4 420;
      opacity: 0.12;
      animation: transmit 12s linear infinite;
    }
    .delay-1 { --offset: 0s; }
    .delay-2 { --offset: 0.16s; }
    .delay-3 { --offset: 0.32s; }
    .delay-4 { --offset: 0.48s; }
    .stage-1 .signal { animation-delay: calc(0.2s + var(--offset, 0s)); }
    .stage-2 .signal { animation-delay: calc(2.4s + var(--offset, 0s)); }
    .stage-3 .signal { animation-delay: calc(4.6s + var(--offset, 0s)); }
    .stage-4 .signal { animation-delay: calc(6.8s + var(--offset, 0s)); }
    .stagger-1 { --offset: 0s; }
    .stagger-2 { --offset: 0.08s; }
    .stagger-3 { --offset: 0.16s; }
    .stagger-4 { --offset: 0.24s; }
    .stagger-5 { --offset: 0.32s; }
    .state {
      font-size: 15px;
      font-weight: 600;
      animation-duration: 12s;
      animation-iteration-count: infinite;
      animation-timing-function: steps(1, end);
    }
    .idle { fill: #596466; animation-name: idle-state; }
    .warm, .hot { fill: #718b73; }
    .warm { animation-name: warm-state; }
    .hot { animation-name: hot-state; }
    .stage-input .state { animation-delay: calc(-0.95s + var(--offset, 0s)); }
    .stage-1 .state { animation-delay: calc(0.28s + var(--offset, 0s)); }
    .stage-2 .state { animation-delay: calc(2.65s + var(--offset, 0s)); }
    .stage-3 .state { animation-delay: calc(4.85s + var(--offset, 0s)); }
    .stage-4 .state { animation-delay: calc(7.05s + var(--offset, 0s)); }
    @keyframes transmit {
      0%, 1% { stroke-dashoffset: 0; opacity: 0; }
      2% { opacity: 0.9; }
      13% { stroke-dashoffset: -260; opacity: 0.84; }
      16%, 100% { stroke-dashoffset: -260; opacity: 0; }
    }
    @keyframes idle-state {
      0%, 8%, 22%, 100% { opacity: 1; }
      9%, 21% { opacity: 0; }
    }
    @keyframes warm-state {
      0%, 8%, 13%, 17%, 22%, 100% { opacity: 0; }
      9%, 12%, 18%, 21% { opacity: 1; }
    }
    @keyframes hot-state {
      0%, 12%, 18%, 100% { opacity: 0; }
      13%, 17% { opacity: 1; }
    }
    @media (prefers-color-scheme: dark) {
      .wire { stroke: #a2ada7; }
      .idle { fill: #a0aaa4; }
      .warm, .hot { fill: #a5c09e; }
      .signal { stroke: #a5c09e; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal, .state { animation: none !important; }
      .signal { opacity: 0; }
      .idle { opacity: 1 !important; }
      .warm, .hot { opacity: 0 !important; }
    }
  </style>

  <g class="wire">
    <path d="M88 175L308 155"/><path d="M88 175L308 200"/>
    <path d="M88 245L308 200"/><path d="M88 245L308 245"/><path d="M88 245L308 290"/>
    <path d="M88 315L308 290"/><path d="M88 315L308 335"/>

    <path d="M332 155L552 155"/><path d="M332 155L552 200"/>
    <path d="M332 200L552 200"/><path d="M332 200L552 245"/>
    <path d="M332 245L552 200"/><path d="M332 245L552 290"/>
    <path d="M332 290L552 245"/><path d="M332 290L552 290"/>
    <path d="M332 335L552 290"/><path d="M332 335L552 335"/>

    <path d="M576 155L796 175"/><path d="M576 155L796 225"/>
    <path d="M576 200L796 175"/><path d="M576 200L796 225"/>
    <path d="M576 245L796 225"/><path d="M576 245L796 275"/>
    <path d="M576 290L796 275"/><path d="M576 290L796 325"/>
    <path d="M576 335L796 275"/><path d="M576 335L796 325"/>

    <path d="M820 175L1040 200"/><path d="M820 175L1040 245"/>
    <path d="M820 225L1040 200"/><path d="M820 225L1040 245"/>
    <path d="M820 275L1040 245"/><path d="M820 275L1040 290"/>
    <path d="M820 325L1040 290"/>
  </g>

  <g class="stage-1">
    <path class="signal delay-1" d="M88 175L308 200"/>
    <path class="signal delay-3" d="M88 245L308 245"/>
    <path class="signal delay-2" d="M88 315L308 290"/>
  </g>
  <g class="stage-2">
    <path class="signal delay-1" d="M332 155L552 200"/>
    <path class="signal delay-3" d="M332 245L552 245"/>
    <path class="signal delay-2" d="M332 335L552 290"/>
  </g>
  <g class="stage-3">
    <path class="signal delay-1" d="M576 155L796 175"/>
    <path class="signal delay-3" d="M576 245L796 275"/>
    <path class="signal delay-2" d="M576 335L796 325"/>
  </g>
  <g class="stage-4">
    <path class="signal delay-1" d="M820 175L1040 200"/>
    <path class="signal delay-3" d="M820 275L1040 245"/>
    <path class="signal delay-2" d="M820 325L1040 290"/>
  </g>

  <g class="neuron stage-input stagger-1"><text class="state idle" opacity="1" x="64" y="180">[○]</text><text class="state warm" opacity="0" x="64" y="180">[◉]</text><text class="state hot" opacity="0" x="64" y="180">[●]</text></g>
  <g class="neuron stage-input stagger-3"><text class="state idle" opacity="1" x="64" y="250">[○]</text><text class="state warm" opacity="0" x="64" y="250">[◉]</text><text class="state hot" opacity="0" x="64" y="250">[●]</text></g>
  <g class="neuron stage-input stagger-5"><text class="state idle" opacity="1" x="64" y="320">[○]</text><text class="state warm" opacity="0" x="64" y="320">[◉]</text><text class="state hot" opacity="0" x="64" y="320">[●]</text></g>

  <g class="neuron stage-1 stagger-1"><text class="state idle" opacity="1" x="308" y="160">[○]</text><text class="state warm" opacity="0" x="308" y="160">[◉]</text><text class="state hot" opacity="0" x="308" y="160">[●]</text></g>
  <g class="neuron stage-1 stagger-2"><text class="state idle" opacity="1" x="308" y="205">[○]</text><text class="state warm" opacity="0" x="308" y="205">[◉]</text><text class="state hot" opacity="0" x="308" y="205">[●]</text></g>
  <g class="neuron stage-1 stagger-3"><text class="state idle" opacity="1" x="308" y="250">[○]</text><text class="state warm" opacity="0" x="308" y="250">[◉]</text><text class="state hot" opacity="0" x="308" y="250">[●]</text></g>
  <g class="neuron stage-1 stagger-4"><text class="state idle" opacity="1" x="308" y="295">[○]</text><text class="state warm" opacity="0" x="308" y="295">[◉]</text><text class="state hot" opacity="0" x="308" y="295">[●]</text></g>
  <g class="neuron stage-1 stagger-5"><text class="state idle" opacity="1" x="308" y="340">[○]</text><text class="state warm" opacity="0" x="308" y="340">[◉]</text><text class="state hot" opacity="0" x="308" y="340">[●]</text></g>

  <g class="neuron stage-2 stagger-1"><text class="state idle" opacity="1" x="552" y="160">[○]</text><text class="state warm" opacity="0" x="552" y="160">[◉]</text><text class="state hot" opacity="0" x="552" y="160">[●]</text></g>
  <g class="neuron stage-2 stagger-2"><text class="state idle" opacity="1" x="552" y="205">[○]</text><text class="state warm" opacity="0" x="552" y="205">[◉]</text><text class="state hot" opacity="0" x="552" y="205">[●]</text></g>
  <g class="neuron stage-2 stagger-3"><text class="state idle" opacity="1" x="552" y="250">[○]</text><text class="state warm" opacity="0" x="552" y="250">[◉]</text><text class="state hot" opacity="0" x="552" y="250">[●]</text></g>
  <g class="neuron stage-2 stagger-4"><text class="state idle" opacity="1" x="552" y="295">[○]</text><text class="state warm" opacity="0" x="552" y="295">[◉]</text><text class="state hot" opacity="0" x="552" y="295">[●]</text></g>
  <g class="neuron stage-2 stagger-5"><text class="state idle" opacity="1" x="552" y="340">[○]</text><text class="state warm" opacity="0" x="552" y="340">[◉]</text><text class="state hot" opacity="0" x="552" y="340">[●]</text></g>

  <g class="neuron stage-3 stagger-1"><text class="state idle" opacity="1" x="796" y="180">[○]</text><text class="state warm" opacity="0" x="796" y="180">[◉]</text><text class="state hot" opacity="0" x="796" y="180">[●]</text></g>
  <g class="neuron stage-3 stagger-2"><text class="state idle" opacity="1" x="796" y="230">[○]</text><text class="state warm" opacity="0" x="796" y="230">[◉]</text><text class="state hot" opacity="0" x="796" y="230">[●]</text></g>
  <g class="neuron stage-3 stagger-4"><text class="state idle" opacity="1" x="796" y="280">[○]</text><text class="state warm" opacity="0" x="796" y="280">[◉]</text><text class="state hot" opacity="0" x="796" y="280">[●]</text></g>
  <g class="neuron stage-3 stagger-5"><text class="state idle" opacity="1" x="796" y="330">[○]</text><text class="state warm" opacity="0" x="796" y="330">[◉]</text><text class="state hot" opacity="0" x="796" y="330">[●]</text></g>

  <g class="neuron stage-4 stagger-1"><text class="state idle" opacity="1" x="1040" y="205">[○]</text><text class="state warm" opacity="0" x="1040" y="205">[◉]</text><text class="state hot" opacity="0" x="1040" y="205">[●]</text></g>
  <g class="neuron stage-4 stagger-3"><text class="state idle" opacity="1" x="1040" y="250">[○]</text><text class="state warm" opacity="0" x="1040" y="250">[◉]</text><text class="state hot" opacity="0" x="1040" y="250">[●]</text></g>
