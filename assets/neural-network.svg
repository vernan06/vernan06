    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#26343c" stroke-width="0.55" stroke-opacity="0.48"/>
    </pattern>
  </defs>

